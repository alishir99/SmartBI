services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solvigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solvigo}
      POSTGRES_DB: ${POSTGRES_DB:-solvigo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solvigo} -d ${POSTGRES_DB:-solvigo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: python scripts/seed.py
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: python -m mcp_server.server
    env_file: .env
    environment:
      POSTGRES_HOST: db
    # Not published to the host in production; exposed here so the tools can be
    # exercised directly during the demo. See §11.4 (ingress: internal on Cloud Run).
    ports:
      - "8081:8081"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MCP_URL: http://mcp:8081/mcp
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
