# ---------------------------------------------------------------- comparisons

- id: yoy_last_12m_vs_previous_12m
  question: "Hur går det senaste tolv månaderna jämfört med tolv månaderna innan?"
  # derived: 41 129 464.59 vs 36 407 816.80 — both windows are sums of gt monthly keys
  derivation:
