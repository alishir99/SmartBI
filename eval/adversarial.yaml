  category: impossible
  question: "Hur mycket kommer vi att sälja i julhandeln 2026? Ge en prognos i kronor."
  expects:
    status: cannot_answer
    must_not_contain_numbers: true
    suggestions_min: 1
    language: sv

- id: impossible_next_week_units
  category: impossible
  question: "Hur många enheter säljer vi nästa vecka?"
  expects:
    status: cannot_answer
    must_not_contain_numbers: true
    language: sv

