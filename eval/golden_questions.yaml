# ---------------------------------------------------------------- geography

- id: sales_by_region_all_time
  question: "Hur fördelar sig försäljningen mellan länen under hela perioden?"
  # The period is named in the question on purpose. Without it the compiler defaults to
  # last_12_months (compiler.py :: resolve_time_range) - correctly - and an expectation
  # demanding all_time would be testing the eval author's assumption, not the system.
  # gt: per_supplier["Nordström Audio AB"].net_sales_by_region
  derivation: {measure: net_sales_sek, group_by: region, where: {relative: all_time}}
  expects:
    series:
      group_by: region
      tolerance_pct: 0.5
      points:
        "Stockholms län": 33696253.72
        "Västra Götalands län": 12800727.63
        "Skåne län": 8919505.47
        "Gotlands län": 381683.44
    tools_called: [query_sales]
    dimensions: [region]
    chart_type: bar
    status: ok
    language: sv

- id: strongest_region_all_time
  question: "Vilket län är vårt starkaste sett över hela perioden?"
  # Period named for the same reason as sales_by_region_all_time: an unqualified
  # question correctly resolves to last_12_months, not to all_time.
  # gt: net_sales_by_region, the largest key - Stockholms län is deliberately over-indexed
  derivation: {measure: net_sales_sek, group_by: region, top: 1,
               where: {relative: all_time}}
  expects:
    numeric: {value: 33696253.72, unit: SEK, tolerance_pct: 0.5}
    must_contain: ["Stockholm"]
    tools_called: [query_sales]
    dimensions: [region]
    chart_type: [bar, kpi]
    status: ok
    language: sv

- id: sales_by_region_last_12m
  question: "Visa försäljning per län för de senaste tolv månaderna."
  # derived: region × net_sales_sek over last_12_months
  derivation: {measure: net_sales_sek, group_by: region,
               where: {relative: last_12_months}}
  expects:
    # No `numeric` here on purpose. This derivation groups without `top:`, so it yields the
    # all-region total, not any one region - an earlier revision asserted the Stockholm
    # figure as `numeric` and it could never have re-derived. The series below already
    # pins every region, which is what the question actually asks for.
    series:
      group_by: region
      tolerance_pct: 0.5
      points:
        "Stockholms län": 17330193.49
        "Västra Götalands län": 6920385.19
        "Skåne län": 4885203.50
    tools_called: [query_sales]
    dimensions: [region]
    chart_type: bar
    status: ok
    language: sv

- id: stockholm_share_of_own_sales
  question: "Hur stor andel av hela periodens försäljning kommer från Stockholms län?"
  # Same reason as sales_by_region_all_time: name the window or get the default.
  # derived: Stockholm net / total own net, all_time - both figures are gt keys
  # (net_sales_by_region["Stockholms län"] / net_sales_sek)
  derivation:
    measure: net_sales_sek
    where: {relative: all_time, region: "Stockholms län"}
    share_of_where: {relative: all_time}
  expects:
    numeric: {value: 36.23, unit: "%", tolerance_pct: 2.0}
    tools_called: [query_sales]
    chart_type: [kpi, bar, pie]
    status: ok
    language: sv

