# Every service reads .env.example first, .env second (optional) - later wins, so a real
# .env still overrides defaults but a fresh clone gets a working demo instead of an error.
# LLM_API_KEY has no default; without it chat answers "LLM_API_KEY är inte satt" but the
# rest of the deterministic path still works.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbi}
      POSTGRES_DB: ${POSTGRES_DB:-smartbi}
    # No published port: publishing 5432 would put credentials-bearing Postgres on the host
    # interface. docker-compose.demo.yml adds it back for hands-on work.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check: docker-entrypoint-initdb.d holds TCP closed until
      # init finishes, so a socket-only pg_isready would report healthy mid-init and race seed.
      test: ["CMD-SHELL",
             "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-smartbi} -d ${POSTGRES_DB:-smartbi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    # data/generated/ is gitignored, so a clean clone needs the CSVs generated first; the
    # test guard avoids regenerating (deterministic) byte-identical files on every boot.
    command: >
      sh -c "test -f data/generated/fact_sales_line.csv ||
             python scripts/generate_data.py --seed 42;
             python scripts/seed.py"
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: python -m mcp_server.server
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
    # Deliberately not published: internal_token is defence in depth, not the boundary - the
    # boundary is that this port isn't reachable (§11.4). demo overlay publishes it for testing.
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      MCP_URL: http://mcp:8081/mcp
      # stdout is what `docker compose logs` reads; the file survives a restart. Same JSON.
      LOG_FILE: /app/logs/api.jsonl
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      # Vite inlines this into the bundle - must be a build arg, not `environment:`, since a
      # static image reads no environment at all.
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:8080"  # 8080 inside: unprivileged nginx can't bind a low port
    depends_on:
      - api

volumes:
  pgdata:
