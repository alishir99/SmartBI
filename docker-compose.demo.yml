# Demo overlay - publishes internal ports for hands-on demos. Not the default: a published
# 8081 turns internal_token from defence in depth into the only guard on every tenant's rows.
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up
services:
  db:
    ports:
      - "5432:5432"

  mcp:
    ports:
      - "8081:8081"
