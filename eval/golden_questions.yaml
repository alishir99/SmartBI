# Golden questions - the measured answer to "how do you know it isn't making things up?"
#
# Each entry is one Swedish question put to the FULL agent through POST /api/chat, plus the
# answer computed WITHOUT the app. Two independent sources back every number:
#
#   gt:         a key path into data/generated/ground_truth.json, which the generator wrote
#               while emitting the rows (scripts/generate_data.py :: build_ground_truth).
#   derivation: a declarative re-computation over the CSVs via eval/oracle.py.
#
# tests/test_expectations.py runs every `derivation` and asserts it still equals the literal
# in `expects`. So these values cannot drift from the data without the test suite failing,
# and nothing here was ever obtained by asking the system.
#
# Tenant: Nordström Audio AB (anna@nordstromaudio.se), brands "Nordström" and "Vidar".
# Coverage: 2024-07-01 → 2026-06-30. Relative windows anchor on the LAST DATE IN THE DATA,
# not on today (mcp_server/semantic/compiler.py :: resolve_time_range), so
# `last_12_months` == 2025-07-01 → 2026-06-30 and `last_month` == May 2026.
#
# Optional alongside `question`:
#   history      [...]  earlier USER questions, asked for real before this one. run_eval.py
#                       feeds the system's own narrative back as the assistant turn, exactly
#                       as web/src/lib/chat.ts does, and grades only the final turn - so the
#                       tool calls and the chart below describe the FOLLOW-UP, not the setup.
#
# expects fields, all optional except `status`:
#   numeric      {value, unit, tolerance_pct}  a figure the answer must carry
#   delta_pct    {value, tolerance_pct}        period-over-period change
#   series       {group_by, points, tolerance_pct}  checked against /api/result rows
#   top_n        {group_by, order, prefix_only}     ordering checked against result rows
#   tools_called [...]        tools that must have been invoked (from SSE tool_call events)
#   dimensions   [...]        expected query_sales grouping
#   chart_type   ...          expected ChartSpec.type; a list means "any of these"
#   must_contain [...]        substrings the narrative must carry (entity names, mostly)
#   caveats_min  N            the card must state at least N caveats
#   status       ok | clarify | cannot_answer
#   language     sv

# ---------------------------------------------------------------- totals over periods

- id: total_net_sales_last_12m
