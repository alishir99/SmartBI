               where: {relative: last_12_months}}
  expects:
    numeric: {value: 2535, unit: st, tolerance_pct: 0.5}
    top_n:
      group_by: product
      prefix_only: true
      order:
        - "Vidar Tillbehör V139 Compact"
        - "Vidar Tillbehör V217 Air"
        - "Vidar Högtalare V178 Max"
        - "Nordström Tillbehör N282 Elite"
        - "Nordström Högtalare N165 Ultra"
    tools_called: [query_sales]
