  # gt: sum of per_supplier["Nordström Audio AB"].net_sales_by_month for 2025-07 … 2026-06
  derivation: {measure: net_sales_sek, where: {relative: last_12_months}}
  expects:
    numeric: {value: 49360103.36, unit: SEK, tolerance_pct: 0.5}
    tools_called: [query_sales]
    dimensions: []
    chart_type: kpi
    status: ok
    language: sv

