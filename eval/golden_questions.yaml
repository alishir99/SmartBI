# 2024 and 2026 are partial (data starts 1 juli 2024, ends 30 juni 2026) - comparing them
# without saying so is misleading.
- id: yearly_trend
  question: "Hur ser försäljningen ut år för år?"
  derivation: {measure: net_sales_sek, group_by: year, where: {relative: all_time}}
  expects:
    series:
      group_by: year
      tolerance_pct: 0.5
      points:
        "2024": 25696913.55
        "2025": 47537629.76
        "2026": 19781872.29
    tools_called: [query_sales]
    dimensions: [year]
    chart_type: [bar, line]
    caveats_min: 1
    status: ok
    language: sv


# Next two differ only in measure and must produce DIFFERENT orderings (revenue: TVs/laptops,
# units: cheap accessories/speakers) - a system that answers both with "top by revenue" fails.
- id: top_products_by_revenue_last_12m
  question: "Vilka är våra tio mest säljande produkter i kronor senaste året?"
  derivation: {measure: net_sales_sek, group_by: product, top: 5,
               where: {relative: last_12_months}}
  expects:
    numeric: {value: 5065665.36, unit: SEK, tolerance_pct: 0.5}
    top_n:
      group_by: product
      prefix_only: true
      order:
        - "Nordström TV N100 Pro"
        - "Nordström TV N230 Ultra"
        - "Nordström Laptop N139 Elite"
        - "Nordström TV N295 Air"
        - "Vidar Hörlurar V191 Studio"
    tools_called: [query_sales]
    dimensions: [product]
    chart_type: bar
    status: ok
    language: sv

