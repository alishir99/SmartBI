[project]
name = "solvigo-insights"
version = "0.1.0"
description = "AI-native sales dashboard for suppliers — MCP semantic layer over a Swedish retail star schema"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # PyJWT, not python-jose: jose was declared and never imported, is unmaintained and
    # carries CVE history, and pulled `cryptography` in behind it. PyJWT was already the
    # library api/auth.py imports — it just happened to resolve transitively through `mcp`,
    # which is a dependency an upgrade could silently drop.
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    # Upper bound is load-bearing, not caution: mcp 2.0 renamed mcp.server.fastmcp to
    # mcp.server.mcpserver, so an unpinned rebuild fails at import in mcp_server/server.py.
    "mcp>=1.2,<2",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # test_compiler.py parses every generated statement to prove it is valid Postgres and
    # that no literal reached the SQL. That is a test dependency, not an ad-hoc CI install:
    # leaving it out of here meant a reviewer following the README got 38 collection errors.
    "sqlglot>=25.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` and `Query(...)` in a default argument is the FastAPI idiom, not the mutable
# default B008 is meant to catch — FastAPI reads these markers off the signature. Listing them
# here keeps B008 switched on everywhere it is actually useful, rather than littering the
# routes with per-line noqa.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
                          "fastapi.Header", "fastapi.Form", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["mcp_server/tests", "api/tests", "eval/tests"]
markers = [
    # Needs a seeded Postgres. These are the assertions a laptop without Docker cannot make:
    # that RLS actually stops a cross-tenant read, and that the tools reproduce
    # ground_truth.json. They skip themselves when no database answers, so `pytest -q` stays
    # a clean-clone command.
    "integration: requires a running, seeded Postgres (see README).",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# There are no __init__.py files: Python has not needed them since 3.3, and pytest does not
# either while no two test modules share a basename. mypy is the one tool that does — api
# and mcp_server each have a `config.py`, and without a package root it sees two modules
# both called `config`. This tells it where the roots are instead.
explicit_package_bases = true
mypy_path = "."
# Test modules use deliberately partial fakes — a FakeMcp implements the three methods the
# loop actually calls, and typing it as the full client would mean importing a protocol that
# exists only to satisfy the checker.
exclude = "tests/"

# The two SDK boundaries. `anthropic` and `mcp` express their request and response shapes as
# large TypedDict unions; we build those payloads as plain dicts on purpose, because the
# provider is swappable behind three settings (decision D1) and pinning our own call sites to
# one vendor's generated types would undo that. Relaxed here, in one place with a reason,
# rather than as `type: ignore` scattered down the call sites.
[[tool.mypy.overrides]]
module = ["api.agent.loop", "api.mcp_client"]
disable_error_code = ["arg-type", "union-attr"]
