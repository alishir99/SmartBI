[project]
name = "smartbi-insights"
version = "0.1.0"
description = "AI-native sales dashboard for suppliers - MCP semantic layer over a Swedish retail star schema"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # PyJWT, not python-jose: jose was unimported, unmaintained, and pulled cryptography
    # in behind it. api/auth.py already imports pyjwt directly.
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    # Upper bound is load-bearing: mcp 2.0 renamed mcp.server.fastmcp, breaking the import
    # in mcp_server/server.py.
    "mcp>=1.2,<2",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # test_compiler.py parses every generated statement to prove it's valid Postgres; a
    # real test dependency, not an ad-hoc CI install.
    "sqlglot>=25.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "mcp_server", "eval"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...)/Query(...) as a default arg is the FastAPI idiom, not the B008 mutable-default
# bug; listing them keeps B008 useful elsewhere instead of noqa-ing every route.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
                          "fastapi.Header", "fastapi.Form", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["mcp_server/tests", "api/tests", "eval/tests"]
markers = [
    # Needs seeded Postgres; skips itself when no database answers, so `pytest -q` stays
    # a clean-clone command.
    "integration: requires a running, seeded Postgres (see README).",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# No __init__.py files (unneeded since 3.3), but mypy needs package roots when two modules
# share a basename (api/config.py and mcp_server/config.py) - this tells it where they are.
explicit_package_bases = true
mypy_path = "."
# Test modules use deliberately partial fakes (e.g. FakeMcp implements only what's called),
# so typing them against the real client would mean importing a protocol just to satisfy mypy.
exclude = "tests/"

# anthropic/mcp express request/response shapes as large TypedDict unions; we build plain
# dicts on purpose so call sites stay swappable behind provider settings (decision D1).
[[tool.mypy.overrides]]
module = ["api.agent.loop", "api.mcp_client"]
disable_error_code = ["arg-type", "union-attr"]
