- id: discount_rate_by_month_last_12m
  question: "Visa rabattgraden per månad senaste året."
  # derived: discount_rate per month; campaign months spike, ordinary months are near zero.
  # The spread is the point: these four literals used to read 22.48 / 22.45 / 22.31 / 22.92 -
  # flat, because the generator discounted every line (D4). This case is now the guard: if a
  # campaign month and an ordinary month ever agree again, the generator has re-broken.
  derivation: {measure: discount_rate, group_by: month,
               where: {relative: last_12_months}}
  expects:
    series:
      group_by: month
      tolerance_pct: 3.0
      points:
        "2025-08-01": 13.46
        "2025-11-01": 13.22
