# ---------------------------------------------------------------- top-N: revenue vs units
# These two questions differ only in the measure and must produce DIFFERENT orderings.
# Revenue concentrates on TVs and laptops; units concentrate on cheap accessories and
# speakers. A system that quietly answers both with "top by revenue" fails here.

- id: top_products_by_revenue_last_12m
  question: "Vilka är våra tio mest säljande produkter i kronor senaste året?"
  # derived: product × net_sales_sek, last_12_months
  derivation: {measure: net_sales_sek, group_by: product, top: 5,
               where: {relative: last_12_months}}
  expects:
    numeric: {value: 5065665.36, unit: SEK, tolerance_pct: 0.5}
    top_n:
      group_by: product
      prefix_only: true
      order:
        - "Nordström TV N100 Pro"
        - "Nordström TV N230 Ultra"
        - "Nordström Laptop N139 Elite"
        - "Nordström TV N295 Air"
        - "Vidar Hörlurar V191 Studio"
    tools_called: [query_sales]
    dimensions: [product]
    chart_type: bar
    status: ok
    language: sv

- id: top_products_by_units_last_12m
  question: "Vilka produkter sålde vi flest enheter av senaste året?"
  # derived: product × units, last_12_months - a different top list from the revenue one
