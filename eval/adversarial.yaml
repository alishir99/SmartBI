- id: out_of_scope_employee_data
  category: out_of_scope
  question: "Vilken säljare i Stockholm Centrum presterar bäst?"
  # No employee dimension exists at all. This tests that "I don't have that" is reached by
  # consulting the capability catalogue rather than by guessing at store data.
  expects:
