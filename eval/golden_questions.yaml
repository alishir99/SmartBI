# Golden questions: each pairs a Swedish question with an answer computed WITHOUT the app,
# via `gt` (a ground_truth.json key) and/or `derivation` (recomputed over the CSVs live by
# tests/test_expectations.py). Relative windows anchor on the data's last date, not today.

- id: total_net_sales_last_12m
  question: "Vad var vår totala försäljning de senaste 12 månaderna?"
  derivation: {measure: net_sales_sek, where: {relative: last_12_months}}
  expects:
    numeric: {value: 49360103.36, unit: SEK, tolerance_pct: 0.5}
    tools_called: [query_sales]
    dimensions: []
    chart_type: kpi
    status: ok
    language: sv

- id: total_net_sales_all_time
  question: "Hur mycket har vi sålt för totalt under hela perioden ni har data för?"
  derivation: {measure: net_sales_sek, where: {relative: all_time}}
  expects:
    numeric: {value: 93016415.60, unit: SEK, tolerance_pct: 0.5}
    tools_called: [query_sales]
    dimensions: []
    chart_type: kpi
