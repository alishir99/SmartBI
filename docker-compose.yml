services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solvigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solvigo}
      POSTGRES_DB: ${POSTGRES_DB:-solvigo}
    # No published port. The services that need Postgres are on this network; publishing
    # 5432 put a database whose credentials are in db/sql/04_rls.sql on the host interface.
    # docker-compose.demo.yml adds it back for hands-on work.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solvigo} -d ${POSTGRES_DB:-solvigo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: python scripts/seed.py
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: python -m mcp_server.server
    env_file: .env
    environment:
      POSTGRES_HOST: db
    # Deliberately not published. `internal_token` is the only thing between this port and
    # a full cross-tenant read, and a shared secret is defence in depth, not the boundary
    # itself — the boundary is that the port is not reachable (§11.4, ingress: internal on
    # Cloud Run). docker-compose.demo.yml publishes it for exercising the tools by hand.
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MCP_URL: http://mcp:8081/mcp
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
