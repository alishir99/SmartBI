name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    # A real Postgres with pgvector, so CI verifies what a laptop without Docker can't: the
    # schema applies, RLS is accepted, and tools return what ground_truth.json expects.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smartbi
          POSTGRES_PASSWORD: smartbi
          POSTGRES_DB: smartbi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartbi -d smartbi"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: smartbi
      POSTGRES_PASSWORD: smartbi
      POSTGRES_DB: smartbi

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check mcp_server api scripts eval
          mypy mcp_server api  # settings live in pyproject's [tool.mypy], so this matches a local run

      # Deselected, not skipped: Postgres is up but the schema isn't applied yet, so
      # the integration suite has nothing to talk to at this point.
      - name: Unit tests (no database needed)
        run: pytest mcp_server/tests api/tests eval/tests -q -m "not integration"

      - name: Apply schema
        run: |
          for file in db/sql/*.sql; do
            echo "--- $file"
            PGPASSWORD=smartbi psql -h localhost -U smartbi -d smartbi -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Generate and seed
        run: |
          python scripts/generate_data.py --seed 42
          python scripts/seed.py

      - name: Prove tenant isolation at the database level
        run: PGPASSWORD=smartbi psql -h localhost -U smartbi -d smartbi -v ON_ERROR_STOP=1 -f db/sql/tests/isolation.sql

      # Tools connect as app_readonly, so RLS applies exactly as in production - the point
      # of running them here rather than mocking.
      - name: Integration tests (against the seeded database)
        run: pytest -q -m integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx tsc --noEmit
      # Chart contract (§8) is deterministic frontend logic, so it's unit-tested, not eyeballed.
      - run: npm test
      - run: npm run build
