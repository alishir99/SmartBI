- id: top_products_stockholm_all_time
  question: "Vilka produkter har sålt bäst i Stockholm under hela perioden?"
  # Fourth case in this file to name its period explicitly. "Stockholm" stays
  # deliberately loose — resolving the city to the län is the point of the case — but
  # the window cannot be left implicit while the expectation is all_time.
  # gt: per_supplier["Nordström Audio AB"].top_10_products_stockholm_by_net_sales
  # (their own example question; requires resolve_entities to turn "Stockholm" into the län)
  derivation: {measure: net_sales_sek, group_by: product, top: 5,
               where: {relative: all_time, region: "Stockholms län"}}
  expects:
    numeric: {value: 3253417.23, unit: SEK, tolerance_pct: 0.5}
    top_n:
      group_by: product
      prefix_only: true
      order:
        - "Nordström TV N100 Pro"
        - "Nordström TV N230 Ultra"
        - "Nordström TV N295 Air"
        - "Vidar Hörlurar V191 Studio"
        - "Vidar Ljudsystem V113 Max"
    tools_called: [resolve_entities, query_sales]
    dimensions: [product]
    chart_type: bar
    status: ok
    language: sv

